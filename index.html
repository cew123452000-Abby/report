<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="sticker">
  <title>我是校園特派小記者：校園新聞仿寫與採訪挑戰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;

      /* 1. Sticker style tokens */
      --background: #fef7ff;
      --surface-container-low: #ffffff;
      --surface-container: #f8eef8;
      --surface-container-high: #f2e8f2;

      --on-surface: #2e1a28;
      --on-surface-variant: #604868;

      --outline: #907898;
      --outline-variant: #dcc8e0;

      --primary: #c2207f;
      --on-primary: #ffffff;
      --primary-container: #f080c0;
      --on-primary-container: #2e1a28;
      --secondary: #7c52aa;
      --on-secondary: #ffffff;
      --tertiary: #0096cc;
      --error: #c53030;
      --on-error: #ffffff;

      --data-1: #c2207f;
      --data-2: #7c52aa;
      --data-3: #0096cc;
      --data-4: #d96a00;
      --data-context: #c8b8d0;

      /* 2. Non-Latin CJK font pairing */
      --font-headline: 'Noto Sans TC', 'DM Sans', sans-serif;
      --font-body: 'Noto Sans TC', 'DM Sans', sans-serif;
      --font-label: 'Noto Sans TC', 'DM Sans', sans-serif;

      /* Shape */
      --rounded: 1rem;
      --rounded-lg: 2rem;
      --rounded-full: 9999px;

      /* Style effects */
      --shadow-pink: 0 4px 16px rgb(224 64 160 / 0.2);
      --shadow-pink-deep: 0 10px 28px rgb(224 64 160 / 0.32);
      --shadow-grape: 0 4px 16px rgb(124 82 170 / 0.2);
      --shadow-grape-deep: 0 10px 28px rgb(124 82 170 / 0.32);
      --shadow-sky: 0 4px 16px rgb(0 150 204 / 0.2);
      --shadow-sky-deep: 0 10px 28px rgb(0 150 204 / 0.3);
      --pop-scale: scale(1.03);
      --lift: translateY(-4px);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* 3. Shared semantic & scale tokens */
      --positive: #15803d;
      --positive-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --error-bg: #fee2e2;
      --sky-bg: #e0f2fe;
      --grape-bg: #f3e8ff;
      --pink-bg: #fce7f3;
      --tangerine: #d96a00;
      --tangerine-bg: #ffedd5;
      --focus: var(--primary);

      /* Type scale (Focused Tool + Friendly Kid Legibility) */
      --display-size: clamp(1.75rem, 1.35rem + 1.5vw, 2.5rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.6vw, 1.625rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem);
      --body-size: clamp(1rem, 0.96rem + 0.2vw, 1.0625rem);
      --label-size: 0.8125rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;
      --space-3xl: 6rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.65;
    }
    header { position: static !important; }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .page-grid {
      display: grid;
      gap: var(--space-lg);
      padding: var(--space-lg);
      max-width: 1120px;
      margin: 0 auto;
      overflow: hidden;
    }
    .page-grid * { min-width: 0; }

    /* Hero / Masthead Panel */
    .hero-panel {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-pink);
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      gap: var(--space-xl);
      align-items: center;
    }

    .kicker-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      background: var(--primary-container);
      color: var(--on-primary-container);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      margin-bottom: var(--space-md);
    }

    .display {
      font-family: var(--font-headline);
      font-weight: 900;
      font-size: var(--display-size);
      line-height: 1.15;
      margin: 0 0 var(--space-sm) 0;
      color: var(--on-surface);
    }
    .display em {
      font-style: normal;
      color: var(--primary);
    }

    .hero-subtitle {
      margin: 0 0 var(--space-lg) 0;
      color: var(--on-surface-variant);
      max-width: 60ch;
    }

    /* Press Pass Widget in Hero */
    .press-pass-card {
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-lg);
      box-shadow: var(--shadow-grape);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .press-pass-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .press-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      background: var(--secondary);
      color: var(--on-secondary);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-size: var(--label-size);
      font-weight: 700;
    }

    .score-figure {
      font-weight: 900;
      font-size: 1.75rem;
      line-height: 1.1;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .field-label {
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-surface-variant);
    }
    .pill-input {
      background: var(--surface-container-low);
      border: 2px solid var(--outline);
      border-radius: var(--rounded-full);
      padding: var(--space-sm) var(--space-md);
      color: var(--on-surface);
      font-weight: 700;
      min-height: 44px;
      width: 100%;
      transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
    }
    .pill-input:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-pink);
    }

    /* Progress Bar */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--surface-container-high);
      border-radius: var(--rounded-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--tertiary);
      border-radius: var(--rounded-full);
      width: 0%;
      transition: width var(--dur-long) var(--ease-bounce);
    }

    /* Badge Case Strip */
    .badge-strip {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-sky);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
    }
    .badge-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-size: var(--label-size);
      font-weight: 700;
      background: var(--surface-container);
      color: var(--on-surface-variant);
      min-height: 36px;
      transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-short) var(--ease-out);
    }
    .badge-chip.earned {
      background: var(--primary-container);
      color: var(--on-primary-container);
      box-shadow: var(--shadow-pink);
      transform: scale(1.02);
    }

    /* Stage Navigation Pills */
    .stage-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--space-sm);
    }
    .stage-tab {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      border: 2px solid transparent;
      background: var(--surface-container-low);
      color: var(--on-surface);
      box-shadow: var(--shadow-grape);
      cursor: pointer;
      min-height: 44px;
      text-align: left;
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .stage-tab:hover {
      transform: var(--lift);
      box-shadow: var(--shadow-grape-deep);
    }
    .stage-tab.active {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-pink-deep);
    }
    .stage-tab.completed:not(.active) {
      background: var(--positive-bg);
      color: var(--positive);
    }
    .stage-tab-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.9;
    }
    .stage-tab-title {
      font-size: 0.9375rem;
      font-weight: 800;
      line-height: 1.3;
    }

    /* Main Stage Card */
    .stage-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-pink);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    .stage-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
    }
    .stage-title {
      font-family: var(--font-headline);
      font-weight: 800;
      font-size: var(--headline-size);
      margin: 0 0 var(--space-xs) 0;
      color: var(--on-surface);
    }
    .stage-desc {
      margin: 0;
      color: var(--on-surface-variant);
      max-width: 65ch;
    }
    .stage-points-pill {
      background: var(--grape-bg);
      color: var(--secondary);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-weight: 800;
      font-size: var(--label-size);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Pre-training Tip Banner */
    .tip-box {
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      gap: var(--space-md);
      align-items: flex-start;
    }
    .tip-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--rounded-full);
      background: var(--tertiary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .tip-content {
      font-size: 0.95rem;
      color: var(--on-surface);
    }
    .tip-content strong {
      color: var(--primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      border: none;
      border-radius: var(--rounded-full);
      padding: var(--space-sm) var(--space-lg);
      min-height: 44px;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-pink);
    }
    .btn-primary:hover:not(:disabled) {
      transform: var(--pop-scale);
      box-shadow: var(--shadow-pink-deep);
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--on-secondary);
      box-shadow: var(--shadow-grape);
    }
    .btn-secondary:hover:not(:disabled) {
      transform: var(--pop-scale);
      box-shadow: var(--shadow-grape-deep);
    }
    .btn-soft {
      background: var(--surface-container);
      color: var(--on-surface);
    }
    .btn-soft:hover:not(:disabled) {
      transform: var(--pop-scale);
      background: var(--surface-container-high);
    }
    .btn-quiet {
      background: transparent;
      color: var(--primary);
      padding: var(--space-xs) var(--space-md);
    }
    .btn-quiet:hover:not(:disabled) {
      background: var(--pink-bg);
    }

    /* Feedback Banner */
    .feedback-box {
      border-radius: var(--rounded);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      font-weight: 600;
      animation: popIn var(--dur-short) var(--ease-bounce);
    }
    .feedback-box.success {
      background: var(--positive-bg);
      color: var(--positive);
    }
    .feedback-box.error {
      background: var(--error-bg);
      color: var(--error);
    }
    .feedback-box.info {
      background: var(--sky-bg);
      color: var(--on-surface);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Stage 1: 5W1H Detective */
    .news-passage {
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-lg);
      font-size: 1.0625rem;
      line-height: 1.9;
    }
    .clue-highlight {
      display: inline-block;
      background: var(--surface-container-low);
      color: var(--primary);
      font-weight: 800;
      padding: 2px 10px;
      margin: 0 2px;
      border-radius: var(--rounded-full);
      box-shadow: var(--shadow-pink);
    }
    .clue-bank {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .clue-chip {
      border: 2px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface);
      border-radius: var(--rounded-full);
      padding: var(--space-sm) var(--space-md);
      min-height: 44px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sky);
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .clue-chip:hover:not(:disabled) {
      transform: var(--pop-scale);
      border-color: var(--primary);
    }
    .clue-chip.selected {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
      box-shadow: var(--shadow-pink-deep);
    }
    .clue-chip.used {
      opacity: 0.45;
      box-shadow: none;
    }

    .w5h1-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-md);
    }
    .w5h1-slot {
      background: var(--surface-container);
      border: 2px dashed var(--outline);
      border-radius: var(--rounded);
      padding: var(--space-md);
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-sm);
      cursor: pointer;
      text-align: left;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .w5h1-slot:hover {
      transform: var(--lift);
      border-color: var(--primary);
    }
    .w5h1-slot.filled {
      border-style: solid;
      border-color: var(--secondary);
      background: var(--surface-container-low);
      box-shadow: var(--shadow-grape);
    }
    .w5h1-slot.correct {
      border-color: var(--positive);
      background: var(--positive-bg);
    }
    .w5h1-slot.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .w5h1-label {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-weight: 800;
      font-size: var(--label-size);
      color: var(--secondary);
    }
    .w5h1-answer {
      font-weight: 700;
      color: var(--on-surface);
      font-size: 0.95rem;
    }
    .w5h1-placeholder {
      color: var(--on-surface-variant);
      font-size: 0.875rem;
    }

    /* Stage 2: Inverted Pyramid */
    .pyramid-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: var(--space-lg);
      align-items: start;
    }
    .pyramid-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
    }
    .pyramid-tier {
      border: 2px dashed var(--outline);
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      padding: var(--space-md);
      min-height: 92px;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
      text-align: left;
    }
    .pyramid-tier.tier-top { width: 100%; }
    .pyramid-tier.tier-mid { width: 86%; }
    .pyramid-tier.tier-bot { width: 72%; }
    .pyramid-tier:hover {
      transform: var(--lift);
      border-color: var(--primary);
    }
    .pyramid-tier.filled {
      border-style: solid;
      border-color: var(--primary);
      box-shadow: var(--shadow-pink);
    }
    .pyramid-tier.correct {
      border-color: var(--positive);
      background: var(--positive-bg);
    }
    .pyramid-tier.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .tier-badge {
      font-size: var(--label-size);
      font-weight: 800;
      color: var(--primary);
    }

    .block-pool {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .puzzle-block {
      background: var(--surface-container-low);
      border: 2px solid var(--outline-variant);
      border-radius: var(--rounded);
      padding: var(--space-md);
      box-shadow: var(--shadow-sky);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-micro) var(--ease-out);
    }
    .puzzle-block:hover:not(:disabled) {
      transform: var(--lift);
      border-color: var(--primary);
    }
    .puzzle-block.selected {
      border-color: var(--primary);
      background: var(--pink-bg);
      box-shadow: var(--shadow-pink-deep);
    }
    .puzzle-block.used {
      opacity: 0.45;
      box-shadow: none;
    }

    /* Stage 3: Fact vs Opinion */
    .flashcard-panel {
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-lg);
    }
    .quote-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-grape);
      max-width: 640px;
      width: 100%;
    }
    .quote-text {
      font-size: clamp(1.25rem, 1.1rem + 0.6vw, 1.625rem);
      font-weight: 800;
      margin: 0;
      color: var(--on-surface);
      line-height: 1.5;
    }
    .binary-choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-md);
      width: 100%;
    }
    .choice-card-btn {
      flex: 1 1 220px;
      max-width: 280px;
      min-height: 64px;
      border-radius: var(--rounded-lg);
      border: 2px solid transparent;
      font-weight: 800;
      font-size: 1.0625rem;
      cursor: pointer;
      padding: var(--space-md) var(--space-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out);
    }
    .choice-fact {
      background: var(--surface-container-low);
      color: var(--secondary);
      box-shadow: var(--shadow-grape);
    }
    .choice-opinion {
      background: var(--surface-container-low);
      color: var(--primary);
      box-shadow: var(--shadow-pink);
    }
    .choice-card-btn:hover:not(:disabled) {
      transform: var(--pop-scale);
    }

    /* Stage 4: Interview Scenarios */
    .option-list {
      display: grid;
      gap: var(--space-md);
    }
    .option-btn {
      background: var(--surface-container-low);
      border: 2px solid var(--outline-variant);
      border-radius: var(--rounded);
      padding: var(--space-md) var(--space-lg);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
      box-shadow: var(--shadow-sky);
      min-height: 56px;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .option-btn:hover:not(:disabled) {
      transform: var(--lift);
      border-color: var(--primary);
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: var(--pink-bg);
    }
    .option-btn.correct {
      border-color: var(--positive);
      background: var(--positive-bg);
    }
    .option-btn.wrong {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: var(--rounded-full);
      background: var(--secondary);
      color: var(--on-secondary);
      display: grid;
      place-items: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Stage 5: Editor Layout & Newspaper Preview */
    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .photo-frame {
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
    }
    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-sm);
    }
    .check-pill {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      background: var(--surface-container);
      border-radius: var(--rounded);
      padding: var(--space-sm) var(--space-md);
      min-height: 44px;
      cursor: pointer;
      font-weight: 600;
      border: 2px solid transparent;
      transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    }
    .check-pill.checked {
      background: var(--positive-bg);
      border-color: var(--positive);
      color: var(--positive);
    }
    .check-pill input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--positive);
      flex-shrink: 0;
    }

    /* Final Published Class Newspaper */
    .newspaper-sheet {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-pink-deep);
      border: 3px solid var(--secondary);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .paper-masthead {
      border-bottom: 4px double var(--on-surface);
      padding-bottom: var(--space-sm);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: var(--space-sm);
    }
    .paper-name {
      font-weight: 900;
      font-size: clamp(1.5rem, 1.2rem + 1vw, 2.25rem);
      color: var(--primary);
      margin: 0;
    }
    .paper-meta {
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-surface-variant);
    }
    .paper-body-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: var(--space-lg);
      align-items: start;
    }
    .paper-headline {
      font-size: clamp(1.35rem, 1.15rem + 0.8vw, 1.875rem);
      font-weight: 900;
      margin: 0 0 var(--space-xs) 0;
      color: var(--on-surface);
    }
    .paper-byline {
      display: inline-block;
      background: var(--grape-bg);
      color: var(--secondary);
      padding: 2px var(--space-md);
      border-radius: var(--rounded-full);
      font-size: var(--label-size);
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .step-dots {
      display: flex;
      gap: var(--space-xs);
      align-items: center;
    }
    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: var(--rounded-full);
      background: var(--outline-variant);
    }
    .step-dot.active {
      background: var(--primary);
      width: 24px;
    }
    .step-dot.done {
      background: var(--positive);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-sm);
    }

    .footer-note {
      text-align: center;
      font-size: var(--label-size);
      color: var(--on-surface-variant);
      padding: var(--space-md) 0 var(--space-xl) 0;
    }

    @media (max-width: 640px) {
      .page-grid { padding: var(--space-sm); gap: var(--space-md); }
      .hero-panel { grid-template-columns: 1fr; padding: var(--space-lg); }
      .pyramid-layout { grid-template-columns: 1fr; }
      .pyramid-tier.tier-mid, .pyramid-tier.tier-bot { width: 100%; }
      .paper-body-grid { grid-template-columns: 1fr; }
      .stage-card { padding: var(--space-lg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    // ---------- Application State ----------

        },

          score: 0,
          completed: false
        },
        stage4: {
          currentIdx: 0,
          answers: [null, null, null, null],
          score: 0,
          completed: false
        },

    var appState = createInitialState();

    // ---------- Persistence Helpers ----------
    async function saveState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState(appState);
        }
      } catch (err) {
        console.warn(`Save state failed:`, err);
      }
    }

    function restoreFromState(saved) {
      if (!saved || typeof saved !== `object`) return;
      var def = createInitialState();
      appState = {
        reporterName: typeof saved.reporterName === `string` ? saved.reporterName : def.reporterName,
        currentStage: typeof saved.currentStage === `number` ? saved.currentStage : def.currentStage,
        stage1: saved.stage1 ? Object.assign({}, def.stage1, saved.stage1) : def.stage1,
        stage2: saved.stage2 ? Object.assign({}, def.stage2, saved.stage2) : def.stage2,
        stage3: saved.stage3 ? Object.assign({}, def.stage3, saved.stage3) : def.stage3,
        stage4: saved.stage4 ? Object.assign({}, def.stage4, saved.stage4) : def.stage4,
        stage5: saved.stage5 ? Object.assign({}, def.stage5, saved.stage5) : def.stage5
      };
    }

    // ---------- Score & Header Sync ----------
    function getTotalScore() {
      return (
        (appState.stage1.score || 0) +
        (appState.stage2.score || 0) +
        (appState.stage3.score || 0) +
        (appState.stage4.score || 0) +
        (appState.stage5.score || 0)
      );
    }

    function getCompletedCount() {
      var count = 0;
      if (appState.stage1.completed) count++;
      if (appState.stage2.completed) count++;
      if (appState.stage3.completed) count++;
      if (appState.stage4.completed) count++;
      if (appState.stage5.completed) count++;
      return count;
    }

    function getRankLabel(score, completedCount) {
      if (completedCount === 5 && score >= 90) return `王牌總編輯`;
      if (completedCount >= 3) return `校園特派記者`;
      if (completedCount >= 1) return `進階小記者`;
      return `實習小記者`;
    }

    function renderChrome() {
      var totalScore = getTotalScore();
      var completedCount = getCompletedCount();
      var pct = Math.round((completedCount / 5) * 100);

      var scoreEl = document.getElementById(`total-score`);
      if (scoreEl) scoreEl.textContent = String(totalScore);

      var rankEl = document.getElementById(`reporter-rank-label`);
      if (rankEl) rankEl.textContent = getRankLabel(totalScore, completedCount);

      var countEl = document.getElementById(`progress-count`);
      if (countEl) countEl.textContent = completedCount + ` / 5 關已完成`;

      var fillEl = document.getElementById(`progress-fill`);
      if (fillEl) fillEl.style.width = pct + `%`;

      var barWrap = document.getElementById(`progress-bar-wrap`);
      if (barWrap) barWrap.setAttribute(`aria-valuenow`, String(pct));

      var nameInput = document.getElementById(`reporter-name-input`);
      if (nameInput && nameInput.value !== appState.reporterName) {
        nameInput.value = appState.reporterName;
      }

      // Badges
      var badgeListEl = document.getElementById(`badge-list`);
      if (badgeListEl) {
        var badgeHtml = ``;
        for (var i = 0; i < BADGES.length; i++) {
          var b = BADGES[i];
          var st = appState[`stage` + b.id];
          var earned = st && st.completed;
          badgeHtml += `<span class="badge-chip` + (earned ? ` earned` : ``) + `">` +
            b.label + (earned ? ` ✓` : `（未解鎖）`) +
            `</span>`;
        }
        badgeListEl.innerHTML = badgeHtml;
      }

      // Stage Nav
      var navEl = document.getElementById(`stage-nav`);
      if (navEl) {
        var navHtml = ``;
        for (var j = 0; j < STAGE_META.length; j++) {
          var m = STAGE_META[j];
          var isActive = appState.currentStage === m.id;
          var isDone = m.id <= 5 ? appState[`stage` + m.id].completed : completedCount === 5;
          var cls = `stage-tab` + (isActive ? ` active` : ``) + (isDone ? ` completed` : ``);
          var statusMark = isDone ? ` ✓` : ``;
          navHtml += `<button type="button" class="` + cls + `" onclick="goToStage(` + m.id + `)">` +
            `<span class="stage-tab-kicker">` + m.short + statusMark + `</span>` +
            `<span class="stage-tab-title">` + m.title + `</span>` +
            `</button>`;
        }
        navEl.innerHTML = navHtml;
      }
    }

    function renderAll() {
      renderChrome();
      var container = document.getElementById(`stage-container`);
      if (!container) return;

      var st = appState.currentStage;
      if (st === 1) container.innerHTML = renderStage1();
      else if (st === 2) container.innerHTML = renderStage2();
      else if (st === 3) container.innerHTML = renderStage3();
      else if (st === 4) container.innerHTML = renderStage4();
      else if (st === 5) container.innerHTML = renderStage5();
      else container.innerHTML = renderSummaryStage();

      if (window.lucide && typeof window.lucide.createIcons === `function`) {
        window.lucide.createIcons();
      }
    }

    // ---------- Global Navigation & Controls ----------
    function goToStage(stageId) {
      appState.currentStage = stageId;
      renderAll();
      saveState();
      var card = document.getElementById(`stage-container`);
      if (card) card.scrollIntoView({ behavior: `smooth`, block: `nearest` });
    }

    function handleNameInput(val) {
      appState.reporterName = val.trim();
      saveState();
      if (appState.currentStage === 5 || appState.currentStage === 6) {
        renderAll();
      }
    }

    function handleResetClick(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.innerHTML = `<i data-lucide="alert-circle" aria-hidden="true"></i><span>再點一次確定全部重來</span>`;
        if (window.lucide && typeof window.lucide.createIcons === `function`) {
          window.lucide.createIcons();
        }
        setTimeout(function() {
          if (btn && btn.dataset.armed === `true`) {
            btn.dataset.armed = `false`;
            btn.innerHTML = `<i data-lucide="rotate-ccw" aria-hidden="true"></i><span>重新挑戰</span>`;
            if (window.lucide && typeof window.lucide.createIcons === `function`) {
              window.lucide.createIcons();
            }
          }
        }, 4000);
        return;
      }
      btn.dataset.armed = `false`;
      btn.innerHTML = `<i data-lucide="rotate-ccw" aria-hidden="true"></i><span>重新挑戰</span>`;
      appState = createInitialState();
      renderAll();
      saveState();
    }

    // ---------- STAGE 1: 5W1H ----------
    function renderStage1() {
      var s1 = appState.stage1;

          `</button>`;

      var allFilled = true;

      return `

          <div class="tip-content">
            <strong>小記者密技：</strong>一則完整的新聞一定要交代六個訊息：<strong>Who（何人）</strong>、<strong>When（何時）</strong>、<strong>Where（何處）</strong>、<strong>What（何事）</strong>、<strong>Why（為何）</strong>、<strong>How（如何）</strong>！

        </article>

        <div>
          <div class="field-label" style="margin-bottom: var(--space-sm);">步驟 1：點選一個新聞線索詞卡</div>

        </div>

        <div>
          <div class="field-label" style="margin-bottom: var(--space-sm);">步驟 2：點選對應的 5W1H 格子放入線索（若想更換，再點一次格子即可拿回）</div>

      renderAll();

    function s1ClickSlot(slotId) {
      var s1 = appState.stage1;
      if (s1.assignments[slotId]) {

        var prev = s1.assignments[slotId];
        s1.assignments[slotId] = ``;
        s1.checked = false;
        if (!s1.selectedChip) s1.selectedChip = prev;
        renderAll();
        saveState();
        return;
      }
      if (s1.selectedChip) {
        s1.assignments[slotId] = s1.selectedChip;
        s1.selectedChip = ``;
        s1.checked = false;
        // Auto-select next available chip for fast play
        var used = {};
        for (var k in s1.assignments) {
          if (s1.assignments[k]) used[s1.assignments[k]] = true;
        }
        for (var i = 0; i < S1_SHUFFLED_CHIPS.length; i++) {
          if (!used[S1_SHUFFLED_CHIPS[i]]) {
            s1.selectedChip = S1_SHUFFLED_CHIPS[i];
            break;
          }
        }
        renderAll();
        saveState();
      }
    }

    function s1Reset() {
      appState.stage1 = createInitialState().stage1;
      renderAll();
      saveState();
    }

    function s1Check() {
      var s1 = appState.stage1;
      var correctCount = 0;
      for (var i = 0; i < S1_ITEMS.length; i++) {
        var it = S1_ITEMS[i];
        if (s1.assignments[it.id] === it.correctText) correctCount++;
      }
      s1.checked = true;
      var earned = Math.round((correctCount / 6) * 20);
      if (earned > s1.score) s1.score = earned;
      if (correctCount === 6) s1.completed = true;
      renderAll();
      saveState();
    }

    function renderStage2() {
      var s2 = appState.stage2;
      var rIdx = s2.roundIdx;
      var round = S2_ROUNDS[rIdx];

      var isDone = s2.roundsDone[rIdx];

      var tierMeta = [

        blocksHtml += `<button type="button" class="` + cls + `" ` + (isUsed ? `disabled` : ``) +

          `<span>` + blk.text + `</span>` +

      }

      var tiersHtml = ``;
      var correctCount = 0;

          `<span class="tier-badge">` + tierMeta[t].label + `</span>` +

          `</button>`;

      var feedbackHtml = ``;
      if (isChecked) {

            `<div>🎉 完美組裝！` + round.feedback + `</div>` +
            `</div>`;

            `<div>目前排對了 ` + correctCount + ` / 3 層！記住口訣：最精華的結果放最上面，現場過程放中間，受訪者心聲放最後喔！點一下紅色格子即可取回重排。</div>` +

          <div class="tip-content">
            <strong>` + round.title + `：</strong>` + round.subtitle + `

          <div style="display: flex; gap: var(--space-sm); flex-wrap: wrap;">

            <div>
              <h4 class="paper-headline">` + chosenTitle + `</h4>
              <span class="paper-byline">特派小記者 ` + reporter + ` ／ 學校操場報導</span>
              <p style="margin: 0 0 var(--space-sm) 0;">
                <strong>【導言】</strong>本校三年級昨天在操場舉辦跳大繩決賽，三甲同學展現默契成功連續跳過 35 下奪得冠軍，現場加油聲不斷。
              </p>
              <p style="margin: 0 0 var(--space-sm) 0;">
                <strong>【本文】</strong>哨聲響起後，搖繩的同學雙手穩定劃出大圓弧，隊員們排成縱隊依序輕巧躍起，節奏整齊一致。
              </p>
              <p style="margin: 0;">
                <strong>【尾段】</strong>三甲小隊長表示：「大家每天利用下課練習兩週，雖然汗流浹背，但一起拿下冠軍真的超有成就感！」
              </p>
            </div>

            <div class="photo-frame">
              <svg viewBox="0 0 360 170" width="100%" height="160" aria-hidden="true">
                <rect x="0" y="0" width="360" height="170" rx="16" fill="var(--sky-bg)"/>
                <rect x="0" y="128" width="360" height="42" fill="var(--positive-bg)"/>
                <path d="M 55 110 Q 180 30 305 110" fill="none" stroke="var(--primary)" stroke-width="4" stroke-dasharray="6 4"/>
                <circle cx="55" cy="84" r="13" fill="var(--secondary)"/>
                <rect x="45" y="99" width="20" height="30" rx="8" fill="var(--secondary)"/>
                <circle cx="135" cy="74" r="13" fill="var(--primary)"/>
                <rect x="125" y="89" width="20" height="28" rx="8" fill="var(--primary)"/>
                <circle cx="180" cy="66" r="13" fill="var(--tangerine)"/>
                <rect x="170" y="81" width="20" height="28" rx="8" fill="var(--tangerine)"/>
                <circle cx="225" cy="74" r="13" fill="var(--tertiary)"/>
                <rect x="215" y="89" width="20" height="28" rx="8" fill="var(--tertiary)"/>
                <circle cx="305" cy="84" r="13" fill="var(--secondary)"/>
                <rect x="295" y="99" width="20" height="30" rx="8" fill="var(--secondary)"/>
              </svg>
              <div style="font-size: 0.9rem; font-weight: 700; color: var(--on-surface);">` + chosenCaption + `</div>
            </div>
          </div>
        </article>

        <div class="action-row">
          <button type="button" class="btn btn-soft" onclick="goToStage(1)">回到第一關複習</button>
          <button type="button" class="btn btn-primary" onclick="exportReport()">
            <i data-lucide="download" aria-hidden="true"></i>
            <span>匯出小記者闖關成績單 (.txt)</span>
          </button>
        </div>
        <div id="export-status" class="field-label" style="text-align: right; color: var(--positive);"></div>
      `;
    }

    function exportReport() {
      var reporter = appState.reporterName || `三年級小記者`;
      var totalScore = getTotalScore();
      var completedCount = getCompletedCount();
      var chosenTitle = appState.stage5.titleIdx !== null
        ? S5_TITLES[appState.stage5.titleIdx].text
        : `尚未選擇`;
      var chosenCaption = appState.stage5.captionIdx !== null
        ? S5_CAPTIONS[appState.stage5.captionIdx].text
        : `尚未選擇`;

      var lines = [
        `=== 我是校園特派小記者：闖關成績單 ===`,
        `小記者姓名：` + reporter,
        `稱號等級：` + getRankLabel(totalScore, completedCount),
        `總分：` + totalScore + ` / 100 分（完成 ` + completedCount + ` / 5 關）`,
        ``,
        `--- 各關成績 ---`,
        `第一關【新聞偵探 5W1H】：` + appState.stage1.score + ` / 20`,
        `第二關【倒金字塔大拼圖】：` + appState.stage2.score + ` / 20`,
        `第三關【事實 vs. 觀點】：` + appState.stage3.score + ` / 20`,
        `第四關【採訪提問大師】：` + appState.stage4.score + ` / 20`,
        `第五關【主編組版大挑戰】：` + appState.stage5.score + ` / 20`,
        ``,
        `--- 我的班級新聞創刊號 ---`,
        `新聞標題：` + chosenTitle,
        `照片圖說：` + chosenCaption
      ].join(`\n`);

      if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === `function`) {
        window.notebookAppApi.triggerFileDownload({
          content: lines,
          contentType: `text/plain`,
          encoding: `UTF-8`,
          filename: `小記者闖關成績單.txt`
        });
      }
      var statusEl = document.getElementById(`export-status`);
      if (statusEl) {
        statusEl.textContent = `✓ 已觸發匯出「小記者闖關成績單.txt」！`;
      }
    }

    // ---------- Initialization ----------
    async function initApp() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          var saved = await window.notebookAppApi.getAppState();
          if (saved) restoreFromState(saved);
        }
      } catch (err) {
        console.warn(`Load state failed:`, err);
      }

      renderAll();

      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
        window.notebookAppApi.notifyAppReady();
      }
    }

    if (document.readyState === `loading`) {
      document.addEventListener(`DOMContentLoaded`, initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
